<style>
  :root {
    --bg: #161618;
    --win: #1F1F22;
    --surface: #27272B;
    --surface-2: #303036;
    --line: #3A3A41;
    --ink: #E8E5E1;
    --muted: #9D9AA3;
    --purple: #A66CFF;
    --red: #F2545B;
    --orange: #FF9A4A;
    --warm: linear-gradient(100deg, #A66CFF 0%, #F2545B 55%, #FF9A4A 100%);
    --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    min-height: 100%;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(242, 84, 91, 0.16), transparent 70%),
      radial-gradient(800px 500px at 0% 10%, rgba(166, 108, 255, 0.14), transparent 70%),
      var(--bg);
    background-attachment: fixed;
  }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .window, footer { position: relative; z-index: 1; }
  body { color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.6; min-height: 100vh; }
  a { color: var(--orange); }
  a:focus-visible, .tile:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  ::selection { background: var(--purple); color: #fff; }

  /* The whole site is one terminal window */
  .window {
    max-width: 1080px; margin: 32px auto 0; border: 1px solid var(--line); border-radius: 10px;
    background: rgba(31, 31, 34, 0.8); overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
  }
  .titlebar {
    position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line);
    font-family: var(--mono); font-size: 13px;
  }
  .titlebar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--warm); }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; color: var(--muted); }
  .crumbs .host { color: var(--ink); font-weight: 600; margin-right: 4px; }
  .crumbs a { color: var(--ink); text-decoration: none; padding: 1px 3px; border-radius: 3px; }
  .crumbs a:hover { background: var(--surface-2); color: var(--orange); }
  .crumbs .here { color: var(--orange); padding: 1px 3px; }
  .wm { display: flex; gap: 8px; }
  .wm i { width: 13px; height: 13px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); }
  .wm i.close { background: var(--red); border-color: var(--red); }

  .term { padding: 30px 32px 44px; }
  main:focus { outline: none; }
  main.enter { animation: enter .3s ease-out; }
  @keyframes enter { from { opacity: 0; } to { opacity: 1; } }

  /* Prompt lines */
  .prompt { font-family: var(--mono); font-size: 15px; margin: 36px 0 16px; color: var(--muted); word-break: break-word; }
  .prompt:first-child { margin-top: 0; }
  .prompt .u { color: var(--purple); font-weight: 600; }
  .prompt .p { color: var(--orange); font-weight: 600; }
  .prompt .c { color: var(--ink); }
  .cursor { display: inline-block; width: 9px; height: 1.1em; vertical-align: -0.2em; background: var(--orange); margin-left: 4px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* neofetch */
  .fetch { max-width: 760px; }
  .info { font-family: var(--mono); font-size: 15px; line-height: 1.75; }
  .info h1 {
    font-family: var(--sans); font-stretch: 72%; font-weight: 800; font-size: clamp(46px, 7vw, 80px);
    line-height: 1; letter-spacing: -0.01em; margin-bottom: 8px; padding-bottom: .08em;
    background: var(--warm); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .info .rule { color: var(--line); overflow: hidden; white-space: nowrap; }
  .info dl { display: grid; grid-template-columns: max-content 1fr; gap: 0 14px; }
  .info dt { color: var(--orange); font-weight: 600; }
  .info dd { color: var(--ink); }

  /* ls output: every clickable thing is a box */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .tile {
    position: relative; display: flex; flex-direction: column; gap: 8px; min-height: 150px; padding: 18px;
    color: var(--ink); text-decoration: none; border-radius: 8px;
    border: 1px solid var(--line);
    background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(var(--line), var(--line)) border-box;
    transition: transform .15s, background .15s;
  }
  .tile:hover {
    transform: translateY(-3px); border-color: transparent;
    background: linear-gradient(var(--surface-2), var(--surface-2)) padding-box, var(--warm) border-box;
  }
  .tile .icon { width: 26px; height: 26px; color: var(--muted); }
  .tile:hover .icon { color: var(--orange); }
  .tile .name { font-family: var(--mono); font-weight: 600; font-size: 15px; word-break: break-word; }
  .tile.dir .name { color: var(--orange); }
  .tile.lnk .name { color: var(--purple); }
  .tile .name .arrow { color: var(--muted); font-weight: 400; }
  .tile .desc { color: var(--muted); font-size: 15px; line-height: 1.45; flex: 1; }
  .tile .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 8px; border-top: 1px solid var(--line); }
  .tiles.home-grid { grid-template-columns: repeat(4, 1fr); }
  .tile.big { grid-column: span 2; }
  .tile.span3 { grid-column: span 3; min-height: 0; flex-direction: row; align-items: center; gap: 16px; }
  .tile.span3 .meta { border: 0; padding: 0; font-size: 14px; color: var(--orange); }
  .tile.big .name { font-size: 18px; }
  .tile.wide { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 16px; }
  .tile.wide .meta { border: 0; padding: 0; font-size: 14px; color: var(--orange); }
  .back { margin-top: 30px; }
  .back .tile { min-height: 0; max-width: 240px; flex-direction: row; align-items: center; }

  /* Detail pages */
  h2 { font-family: var(--sans); font-stretch: 78%; font-weight: 800; font-size: clamp(30px, 4.6vw, 46px); line-height: 1.05; margin-bottom: 20px; }
  .detail { display: grid; grid-template-columns: 1fr 280px; gap: 20px; align-items: start; }
  .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 24px; }
  .panel h3 { font-size: 22px; font-weight: 700; font-stretch: 85%; }
  .panel .role { font-family: var(--mono); font-size: 14px; color: var(--purple); margin: 2px 0 14px; }
  .panel ul { padding-left: 20px; }
  .panel li { margin: 10px 0; }
  .panel li::marker { color: var(--orange); }
  .panel p + p { margin-top: 12px; }
  .spec { font-family: var(--mono); font-size: 13px; }
  .spec dt { color: var(--orange); margin-top: 14px; }
  .spec dt:first-child { margin-top: 0; }
  .tags, .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tags span, .chips span { font-family: var(--mono); font-size: 12px; padding: 3px 9px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); }
  .media {
    margin-top: 20px; aspect-ratio: 16 / 9; border-radius: 6px; border: 1px dashed var(--line); background: var(--bg);
    display: grid; place-items: center; color: var(--muted); font-family: var(--mono); font-size: 13px;
  }
  .skillgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .skillgrid .panel h3 { font-size: 18px; margin-bottom: 8px; font-family: var(--mono); font-stretch: 100%; color: var(--orange); }

  /* Hobbies */
  .empty { font-family: var(--mono); font-size: 14px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 22px; background: var(--surface); }
  .empty b { color: var(--ink); font-weight: 600; }
  .videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .videos:has(.wide) { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
  .vid { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
  .vid .frame { aspect-ratio: 9 / 16; background: #000; }
  .vid.wide .frame { aspect-ratio: 16 / 9; }
  .vid iframe, .vid video { width: 100%; height: 100%; border: 0; display: block; object-fit: cover; }
  .vid .cap, .shot .cap { font-family: var(--mono); font-size: 13px; padding: 10px 12px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .shot { padding: 0; min-height: 0; overflow: hidden; cursor: zoom-in; font: inherit; text-align: left; }
  .shot img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  dialog.viewer { margin: auto; max-width: min(92vw, 1100px); background: var(--win); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 0; overflow: hidden; }
  dialog.viewer::backdrop { background: rgba(10, 10, 12, 0.8); }
  dialog.viewer .titlebar button { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 2px 10px; cursor: pointer; }
  dialog.viewer .titlebar button:hover { border-color: var(--orange); color: var(--orange); }
  dialog.viewer img { display: block; max-width: 100%; max-height: 80vh; margin: 0 auto; }

  /* Background controls */
  .tune { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  .tune:hover { border-color: var(--orange); color: var(--orange); }
  .tune b { color: var(--orange); font-weight: 600; }
  footer .bgnote { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  footer { max-width: 1080px; margin: 18px auto 48px; padding: 0 6px; font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  @media (max-width: 1120px) { .window { margin: 16px 16px 0; } footer { margin: 14px 22px 40px; } }
  @media (max-width: 900px) {
    .tiles.home-grid { grid-template-columns: repeat(2, 1fr); }
    .tile.span3 { grid-column: 1 / -1; }
  }
  @media (max-width: 560px) {
    .tiles.home-grid { grid-template-columns: 1fr; }
    .tile.big, .tile.span3 { grid-column: auto; flex-direction: column; align-items: flex-start; }
  }
  @media (max-width: 760px) {
    .term { padding: 22px 18px 32px; }
    .detail { grid-template-columns: 1fr; }
    .tile.big { grid-column: auto; }
    .tile.wide { flex-direction: column; align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    main.enter, .cursor { animation: none; }
    .tile { transition: none; }
    .tile:hover { transform: none; }
  }
</style>
</head>

function tile({ href, icon, name, desc, meta, external, big, wide, span3, kind }) {
  const ext = external ? ' target="_blank" rel="noopener"' : "";
  const cls = ["tile", big && "big", wide && "wide", span3 && "span3", kind].filter(Boolean).join(" ");
  return `<a class="${cls}" href="${href}"${ext}>${ICON[icon]}<span class="name">${name}</span>${desc ? `<span class="desc">${desc}</span>` : ""}${meta ? `<span class="meta">${meta}</span>` : ""}</a>`;
}
function backTile(href, label) { return `<div class="back">${tile({ href, icon: "up", name: label, kind: "dir" })}</div>`; }
function prompt(path, cmd, cursor) {

}

function experienceDir() {
  return `${prompt("~/experience", "ls")}
    <div class="tiles">${EXPERIENCE.map(e => tile({ href: `#/experience/${e.id}`, icon: "folder", kind: "dir", name: `${e.name}/`, desc: `${e.role}. ${e.short}`, meta: e.when })).join("")}</div>
    ${backTile("#/", "cd ..")}`;
}
function projectsDir() {
  return `${prompt("~/projects", "ls")}
    <div class="tiles">${PROJECTS.map(p => tile({ href: `#/projects/${p.id}`, icon: "folder", kind: "dir", name: `${p.name}/`, desc: p.short, meta: p.when || "Personal project", big: true })).join("")}</div>
    ${backTile("#/", "cd ..")}`;
}
function experienceDetail(e) {
  return `${prompt(`~/experience/${e.name}`, "cat README.md")}
    <h2>${e.org}</h2>
    <div class="detail">
      <div class="panel"><h3>${e.role}</h3><p class="role">${e.when}</p>
        <ul>${e.bullets.map(b => `<li>${b}</li>`).join("")}</ul></div>
      <div class="panel"><dl class="spec">
        <dt>dates</dt><dd>${e.when}</dd>
        <dt>stack</dt><dd><div class="tags">${e.tags.map(t => `<span>${t}</span>`).join("")}</div></dd>
      </dl></div>
    </div>
    ${backTile("#/experience", "cd ..")}`;
}
function projectDetail(p) {
  const link = p.link ? `<div class="tiles" style="margin-top:20px">${tile({ href: p.link.href, icon: "link", kind: "lnk", name: sym("video", "linkedin"), desc: p.link.label, external: true })}</div>` : "";
  const media = p.media ? `<div class="media">${p.media}</div>` : "";
  return `${prompt(`~/projects/${p.name}`, "cat README.md")}
    <h2>${p.title}</h2>
    <div class="detail">
      <div class="panel">${p.body.map(t => `<p>${t}</p>`).join("")}${media}${link}</div>
      <div class="panel"><dl class="spec">
        ${p.when ? `<dt>dates</dt><dd>${p.when}</dd>` : ""}
        <dt>built with</dt><dd><div class="tags">${p.tags.map(t => `<span>${t}</span>`).join("")}</div></dd>
      </dl></div>
    </div>
    ${backTile("#/projects", "cd ..")}`;
}
function skillsPage() {
  return `${prompt("~/skills", "cat *")}
    <div class="skillgrid">${SKILLS.map(s => `<div class="panel"><h3>${s.name.toLowerCase().replace(/ & /g, "-").replace(/ /g, "-")}</h3><div class="chips">${s.items.map(i => `<span>${i}</span>`).join("")}</div></div>`).join("")}</div>
    ${backTile("#/", "cd ..")}`;
}
function hobbiesDir() {
  return `${prompt("~/hobbies", "ls")}
    <div class="tiles">${HOBBIES.map(h => tile({ href: `#/hobbies/${h.id}`, icon: "folder", kind: "dir", name: `${h.name}/`, desc: h.short, meta: `${h.items.length} ${h.kind === "video" ? "videos" : "drawings"}`, big: true })).join("")}</div>
    ${backTile("#/", "cd ..")}`;
}
function hobbyDetail(h) {
  const ext = h.kind === "video" ? "*.mp4" : "*.jpg";
  let body;
  if (!h.items.length) {
    body = `<div class="empty">total 0<br><b>${h.kind === "video" ? "Videos" : "Drawings"} are on the way.</b></div>`;
  } else if (h.kind === "video") {
    body = `<div class="videos">${h.items.map(v => {
      const src = v.youtube
        ? `<iframe src="https://www.youtube-nocookie.com/embed/${v.youtube}" title="${v.title}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
        : `<video src="${v.file}"${v.file.endsWith(".mp4") ? ` poster="${v.file.replace(/\.mp4$/, ".jpg")}"` : ""} controls playsinline preload="none"></video>`;
      return `<div class="vid${v.vertical === false ? " wide" : ""}"><div class="frame">${src}</div><div class="cap">${v.title}</div></div>`;
    }).join("")}</div>`;
  } else {
    body = `<div class="gallery">${h.items.map((img, i) =>
      `<button type="button" class="tile shot" data-i="${i}"><img src="${img.file}" alt="${img.title}" loading="lazy"><span class="cap">${img.title}</span></button>`).join("")}</div>`;
  }
  return `${prompt(`~/hobbies/${h.name}`, `ls ${ext}`)}<h2>${h.title}</h2>${body}${backTile("#/hobbies", "cd ..")}`;
}
function openViewer(h, i) {
  const img = h.items[i], v = document.getElementById("viewer");
  document.getElementById("viewer-img").src = img.file;
  document.getElementById("viewer-img").alt = img.title;
  document.getElementById("viewer-title").innerHTML = `<span class="host">feh</span>&nbsp;<span class="here">${img.file.split("/").pop()}</span>`;
  v.showModal();
}

function notFound(path) {
  return `${prompt("~", "cd " + path)}<p class="prompt" style="margin-top:0">bash: cd: ${path}: No such file or directory</p>${backTile("#/", "cd ~")}`;
}

function crumbs(parts) {
  let path = "#";
  const out = [`<span class="host">george@uwaterloo:</span>`, parts.length ? `<a href="#/">~</a>` : `<span class="here">~</span>`];
  parts.forEach((seg, i) => {
    path += "/" + seg.link;
    out.push("/");
    out.push(i === parts.length - 1 ? `<span class="here">${seg.label}</span>` : `<a href="${path}">${seg.label}</a>`);
  });
  return out.join("");
}

function render() {
  const raw = location.hash.replace(/^#\/?/, "");
  const [top, id] = raw.split("/").filter(Boolean);
  let html, crumb = [], title = "George Petrisis";
  if (!top) html = home();
  else if (top === "experience") {
    crumb = [{ link: "experience", label: "experience" }];
    if (!id) { html = experienceDir(); title = "experience — George Petrisis"; }
    else {
      const e = EXPERIENCE.find(x => x.id === id);
      html = e ? experienceDetail(e) : notFound(raw);
      if (e) { crumb.push({ link: e.id, label: e.name }); title = `${e.org} — George Petrisis`; }
    }
  }
  else if (top === "projects") {
    crumb = [{ link: "projects", label: "projects" }];
    if (!id) { html = projectsDir(); title = "projects — George Petrisis"; }
    else {
      const p = PROJECTS.find(x => x.id === id);
      html = p ? projectDetail(p) : notFound(raw);
      if (p) { crumb.push({ link: p.id, label: p.name }); title = `${p.title} — George Petrisis`; }
    }
  }
  else if (top === "hobbies") {
    crumb = [{ link: "hobbies", label: "hobbies" }];
    if (!id) { html = hobbiesDir(); title = "hobbies — George Petrisis"; }
    else {
      const h = HOBBIES.find(x => x.id === id);
      html = h ? hobbyDetail(h) : notFound(raw);
      if (h) {
        crumb.push({ link: h.id, label: h.name }); title = `${h.title} — George Petrisis`;
        setTimeout(() => document.querySelectorAll(".shot").forEach(b => b.addEventListener("click", () => openViewer(h, +b.dataset.i))));
      }
    }
  }
  else if (top === "skills") { crumb = [{ link: "skills", label: "skills" }]; html = skillsPage(); title = "skills — George Petrisis"; }
  else html = notFound(raw);

  document.getElementById("crumbs").innerHTML = crumbs(crumb);
  const app = document.getElementById("app");
  app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter");
  app.innerHTML = html;
  document.title = title;
  window.scrollTo(0, 0);
  if (top) app.focus({ preventScroll: true });
}
window.addEventListener("hashchange", render);
render();

/* Background: a dot grid lit by a PID-controlled follower that chases your cursor. */
(function () {
  const canvas = document.getElementById("bg"), ctx = canvas.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const MODES = [
    { label: "under", kp: 0.018, kd: 0.09 },
    { label: "critical", kp: 0.018, kd: 0.27 },
    { label: "over", kp: 0.018, kd: 0.6 }
  ];
  let mode = 0, W = 0, H = 0, dpr = 1;
  const pos = { x: innerWidth / 2, y: innerHeight / 3 }, vel = { x: 0, y: 0 };
  const target = { x: pos.x, y: pos.y };
  let lastMove = 0, trail = [];
  const GAP = 28, R = 190;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize); resize();
  addEventListener("pointermove", e => { target.x = e.clientX; target.y = e.clientY; lastMove = performance.now(); }, { passive: true });

  const tune = document.getElementById("tune");
  tune.addEventListener("click", () => { mode = (mode + 1) % MODES.length; tune.innerHTML = `damping: <b>${MODES[mode].label}</b>`; });

  function warm(t, a) { // purple -> red -> orange
    const stops = [[166, 108, 255], [242, 84, 91], [255, 154, 74]];
    const s = t < 0.55 ? 0 : 1, u = s === 0 ? t / 0.55 : (t - 0.55) / 0.45;
    const A = stops[s], B = stops[s + 1];
    return `rgba(${A.map((c, i) => Math.round(c + (B[i] - c) * u)).join(",")},${a})`;
  }

  function frame(now) {
    // idle: the setpoint drifts on a slow Lissajous path
    if (now - lastMove > 4000) {
      const t = now / 1000;
      target.x = W * (0.5 + 0.32 * Math.sin(t * 0.37));
      target.y = H * (0.5 + 0.28 * Math.sin(t * 0.53 + 1));
    }
    const m = MODES[mode];
    for (const k of ["x", "y"]) { vel[k] += m.kp * (target[k] - pos[k]) - m.kd * vel[k]; pos[k] += vel[k]; }
    trail.push({ x: pos.x, y: pos.y }); if (trail.length > 40) trail.shift();

    ctx.clearRect(0, 0, W, H);
    for (let y = GAP / 2; y < H; y += GAP) {
      for (let x = GAP / 2; x < W; x += GAP) {
        const d = Math.hypot(x - pos.x, y - pos.y);
        if (d > R) { ctx.fillStyle = "rgba(157,154,163,0.10)"; ctx.fillRect(x - 1, y - 1, 2, 2); continue; }
        const k = 1 - d / R, s = 1 + k * 1.6;
        ctx.fillStyle = warm(x / W, 0.15 + k * 0.75);
        ctx.fillRect(x - s, y - s, s * 2, s * 2);
      }
    }
    // trail
    for (let i = 1; i < trail.length; i++) {
      ctx.strokeStyle = warm(i / trail.length, (i / trail.length) * 0.6);
      ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
    }
    // follower and setpoint
    const g = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 22);
    g.addColorStop(0, "rgba(255,154,74,0.9)"); g.addColorStop(1, "rgba(242,84,91,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(pos.x, pos.y, 22, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(232,229,225,0.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(target.x - 7, target.y); ctx.lineTo(target.x + 7, target.y);
    ctx.moveTo(target.x, target.y - 7); ctx.lineTo(target.x, target.y + 7); ctx.stroke();

    if (!reduce) requestAnimationFrame(frame);
  }
  if (reduce) { frame(0); tune.parentElement.style.display = "none"; }
  else requestAnimationFrame(frame);
})();
</script>
</body>
